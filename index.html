<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wednesday Hoops</title>
<title>MY SHOTS WET</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; background: #fafafa; color: #222; }
  h1 { margin-bottom: 4px; }
  h2 { margin-top: 28px; font-size: 1.1rem; }
  .sub { color: #666; margin-top: 0; }
  form { display: flex; flex-direction: column; gap: 8px; margin: 16px 0; }
  input[type=text], input[type=email] { padding: 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; }
  button { padding: 10px 14px; font-size: 1rem; border: 0; border-radius: 6px; background: #e8590c; color: #fff; cursor: pointer; }
  button.link { background: none; color: #c00; padding: 4px 8px; font-size: .85rem; }
  button.plain { background: none; color: #888; font-size: .8rem; padding: 4px; text-decoration: underline; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px; background: #fff; border: 1px solid #eee; border-radius: 6px; margin-bottom: 6px; }
  li .who { flex: 1; display: flex; flex-direction: column; }
  li .email, li .time { font-size: .8rem; color: #888; }
  label { font-size: .85rem; color: #555; display: flex; align-items: center; gap: 4px; }
  .empty { color: #888; }
  .count { font-weight: 600; }
  .badge { font-size: .8rem; color: #2b8a3e; }
  .msg { color: #2b8a3e; min-height: 1.2em; margin: 0; }
  .err { color: #c00; }
  footer { margin-top: 32px; text-align: center; }
</style>
</head>
<body>
  <h1>🏀 Wednesday Hoops</h1>
  <p class="sub" id="dateLabel"></p>

  <form id="form">
    <input type="text" id="name" placeholder="Your name" maxlength="40" required autocomplete="off">
    <input type="email" id="email" placeholder="Your email" maxlength="100" required autocomplete="off">
    <button type="submit">I'm in</button>
    <p class="msg" id="msg"></p>
  </form>

  <h2>Playing this week (<span class="count" id="count">0</span>)</h2>
  <ul id="list"></ul>
  <p class="empty" id="empty">No one yet. Be the first!</p>

  <p class="msg err" id="loadErr"></p>

  <footer>
    <button class="plain" id="authBtn">Admin sign in</button>
  </footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  // ====== PASTE YOUR FIREBASE CONFIG HERE (see README) ======
  const firebaseConfig = {
    apiKey: "AIzaSyD561cOnYnvedJXjm3cpH8GBos9bTp0pCA",
    authDomain: "bigpapiballers.firebaseapp.com",
    projectId: "bigpapiballers",
    storageBucket: "bigpapiballers.firebasestorage.app",
    messagingSenderId: "708128712850",
    appId: "1:708128712850:web:450e53641729d7601a5e4b"
  };
  // Your Google email. This only controls what the page SHOWS.
  // The real lock is in the Firestore rules (see README).
  const ADMIN_EMAIL = "myshotwet23@gmail.com";
  // ===========================================================

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();
  const signups = db.collection("signups");
  const contacts = db.collection("contacts");

  // Next Wednesday (today counts if it's Wednesday), in the visitor's local time
  function nextWednesday() {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + ((3 - d.getDay() + 7) % 7));
    return d;
  }
  const run = nextWednesday();
  const runKey = run.getFullYear() + "-" +
    String(run.getMonth() + 1).padStart(2, "0") + "-" +
    String(run.getDate()).padStart(2, "0");

  document.getElementById("dateLabel").textContent =
    run.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });

  // ---------- state ----------
  let isAdmin = false;
  let weekDocs = [];
  let emailById = {};
  let unsubContacts = null;

  // ---------- sign up ----------
  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const nameEl = document.getElementById("name");
    const emailEl = document.getElementById("email");
    const msg = document.getElementById("msg");
    const name = nameEl.value.trim();
    const email = emailEl.value.trim();
    if (!name || !email) return;
    msg.className = "msg";
    try {
      const ref = signups.doc();
      const batch = db.batch();
      batch.set(ref, {
        name, runDate: runKey, attended: false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      batch.set(contacts.doc(ref.id), { name, email, runDate: runKey });
      await batch.commit();
      nameEl.value = "";
      emailEl.value = "";
      msg.textContent = "You're in!";
    } catch (err) {
      msg.className = "msg err";
      msg.textContent = "Something went wrong. Try again.";
    }
  });

  // ---------- this week's list ----------
  signups.where("runDate", "==", runKey).onSnapshot((snap) => {
    weekDocs = snap.docs.sort((a, b) =>
      (a.data().createdAt?.seconds || 0) - (b.data().createdAt?.seconds || 0));
    document.getElementById("loadErr").textContent = "";
    renderList();
  }, (err) => {
    console.error(err);
    document.getElementById("loadErr").textContent = "Couldn't load the list: " + err.message;
  });

  function renderList() {
    const list = document.getElementById("list");
    list.innerHTML = "";
    weekDocs.forEach((doc) => {
      const data = doc.data();
      const li = document.createElement("li");

      const who = document.createElement("span");
      who.className = "who";
      const nameEl = document.createElement("span");
      nameEl.textContent = data.name;
      who.appendChild(nameEl);
      const t = document.createElement("span");
      t.className = "time";
      t.textContent = data.createdAt
        ? "Signed up " + data.createdAt.toDate().toLocaleString(undefined,
            { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })
        : "Signed up just now";
      who.appendChild(t);
      if (isAdmin && emailById[doc.id]) {
        const em = document.createElement("span");
        em.className = "email";
        em.textContent = emailById[doc.id];
        who.appendChild(em);
      }
      li.appendChild(who);

      if (isAdmin) {
        const label = document.createElement("label");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = !!data.attended;
        cb.addEventListener("change", () => doc.ref.update({ attended: cb.checked }));
        label.append(cb, "Showed up");

        const del = document.createElement("button");
        del.className = "link";
        del.textContent = "Remove";
        del.addEventListener("click", async () => {
          if (!confirm("Remove " + data.name + "?")) return;
          const batch = db.batch();
          batch.delete(doc.ref);
          batch.delete(contacts.doc(doc.id));
          await batch.commit();
        });
        li.append(label, del);
      } else if (data.attended) {
        const b = document.createElement("span");
        b.className = "badge";
        b.textContent = "✓ showed up";
        li.appendChild(b);
      }
      list.appendChild(li);
    });
    document.getElementById("count").textContent = weekDocs.length;
    document.getElementById("empty").style.display = weekDocs.length ? "none" : "block";
  }

  // ---------- admin auth ----------
  const authBtn = document.getElementById("authBtn");
  authBtn.addEventListener("click", () => {
    if (auth.currentUser) auth.signOut();
    else auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(() => {});
  });

  auth.onAuthStateChanged((user) => {
    isAdmin = !!user && user.email === ADMIN_EMAIL;
    authBtn.textContent = user ? "Sign out" : "Admin sign in";
    if (unsubContacts) { unsubContacts(); unsubContacts = null; }
    emailById = {};
    if (isAdmin) {
      unsubContacts = contacts.where("runDate", "==", runKey).onSnapshot((snap) => {
        emailById = {};
        snap.docs.forEach((d) => { emailById[d.id] = d.data().email; });
        renderList();
      });
    }
    renderList();
  });
</script>
</body>
</html>
